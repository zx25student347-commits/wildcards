
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wildcards
      MYSQL_USER: wildcards
      MYSQL_PASSWORD: wildcards
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/wildcards
      SPRING_DATASOURCE_USERNAME: wildcards
      SPRING_DATASOURCE_PASSWORD: wildcards
    depends_on:
      - db

volumes:
  db_data:
