<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - WildCards</title>
    <link rel="stylesheet" href="/css/fragmentos-estilo.css">
    <link rel="stylesheet" href="/css/wildcards.css">
    <script src="/js/wildcards.js" defer></script>
</head>
<body>

    <header th:replace="~{fragmentos/layout :: header}"></header>

    <main class="contenedor-pedidos">
        <h1>Mis Pedidos</h1>

        <div class="seccion-pedidos">
            <h2>Pedidos Pendientes de Pago</h2>
            <div id="pedidos-pendientes" class="lista-pedidos">
                <p>No tienes pedidos pendientes de pago.</p>
            </div>
        </div>

        <div class="seccion-pedidos">
            <h2>Pedidos Pagados</h2>
            <div id="pedidos-pagados" class="lista-pedidos">
                <p>No tienes pedidos pagados.</p>
            </div>
        </div>
        
        <div class="seccion-pedidos">
            <h2>Pedidos Enviados</h2>
            <div id="pedidos-enviados" class="lista-pedidos">
                <p>No tienes pedidos enviados.</p>
            </div>
        </div>

        <div class="seccion-pedidos">
            <h2>Pedidos Entregados</h2>
            <div id="pedidos-entregados" class="lista-pedidos">
                <p>No tienes pedidos entregados.</p>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragmentos/layout :: footer}"></footer>

    <script src="/js/pedidos.js"></script>
</body>
</html>
