<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — Wildcards</title>
    <link rel="stylesheet" href="carrito.css">
</head>

<body>

    <header class="barra-navegacion">
        <div class="contenedor">

            <div class="logo">WILDCARDS</div>

            <nav>
                <a href="#">Pokémon</a>
                <a href="#">One Piece</a>
                <a href="#">Yu-Gi-Oh!</a>
                <a href="#">Magic</a>
            </nav>

            <div class="iconos-nav">
                <a href="#" class="icono-enlace">👤</a>

                <a href="#" class="icono-enlace icono-carrito">
                    🛒
                    <span id="contadorCarrito" class="contador-carrito"></span>
                </a>
            </div>

        </div>
    </header>

    <main class="contenedor-principal">
        <div class="panel">

            <h1 class="titulo">🛒 Tu carrito</h1>
            <p class="subtitulo">Revisa los artículos antes de pagar</p>

            <section class="cuadricula">

                <div id="listaCarrito" class="lista-carrito"></div>

                <aside class="resumen">
                    <h3>Resumen</h3>

                    <div class="item-resumen">
                        <div class="circulo violeta">📦</div>
                        <div>
                            <span id="cantidadTotal" class="numero-grande">0</span>
                            <p>Artículos</p>
                        </div>
                    </div>

                    <div class="item-resumen">
                        <div class="circulo verde">💰</div>
                        <div>
                            <span id="precioTotal" class="numero-grande">0.00 €</span>
                            <p>Total</p>
                        </div>
                    </div>

                    <button id="botonPagar" class="boton-pagar">PAGAR</button>
                </aside>

            </section>

        </div>
    </main>

    <!-- PLANTILLA PRODUCTO -->
    <template id="plantillaProducto">
        <div class="tarjeta-carrito">
            <div class="cuerpo-item">
                <div class="titulo-item"></div>
                <div class="meta-item"></div>
            </div>
            <div class="controles-item">
                <input type="number" class="cantidad-item" min="1" value="1">
                <div class="precio-item"></div>
                <button class="boton-eliminar">Eliminar</button>
            </div>
        </div>
    </template>

</body>

</html>
