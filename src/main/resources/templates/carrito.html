<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — Wildcards</title>
    <link rel="stylesheet" href="/css/fragmentos-estilo.css">
    <link rel="stylesheet" href="/css/carrito.css">
    <script src="/js/wildcards.js" defer></script>
    <script src="/js/carrito.js" defer></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
    <header th:replace="~{fragmentos/layout :: header}"></header>

    <main class="contenedor-principal">
        <div class="panel">

            <h1 class="titulo">🛒 Tu carrito</h1>
            <p class="subtitulo">Revisa los artículos antes de pagar</p>

            <section class="cuadricula">

                <div id="listaCarrito" class="lista-carrito"></div>

                <aside class="resumen">
                    <h3>Resumen</h3>

                    <div class="item-resumen">
                        <div class="circulo violeta">📦</div>
                        <div>
                            <span id="cantidadTotal" class="numero-grande">0</span>
                            <p>Artículos</p>
                        </div>
                    </div>

                    <div class="item-resumen">
                        <div class="circulo verde">💰</div>
                        <div>
                            <span id="precioTotal" class="numero-grande">0.00 €</span>
                            <p>Total</p>
                        </div>
                    </div>

                    <button id="botonPagar" class="boton-pagar">PAGAR</button>
                </aside>

            </section>

        </div>
    </main>

    <!-- PLANTILLA PRODUCTO -->
    <template id="plantillaProducto">
        <div class="tarjeta-carrito">
            <div class="cuerpo-item">
                <div class="titulo-item"></div>
                <div class="meta-item"></div>
            </div>
            <div class="controles-item">
                <input type="number" class="cantidad-item" min="1" value="1">
                <div class="precio-item"></div>
                <button class="boton-eliminar">Eliminar</button>
            </div>
        </div>
    </template>

    <!-- MODAL DE PAGO -->
    <div id="modalPago" class="modal-overlay">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Finalizar Compra</h2>
                <span class="close-modal">&times;</span>
            </div>
            
            <form id="formularioPago" class="modal-body">
                <p class="modal-total">Total a pagar: <span id="totalModal" class="precio-destacado">0.00 €</span></p>
                
                <h3>Selecciona Método de Pago</h3>
                <div class="opciones-pago">
                    <label class="opcion-pago-label">
                        <input type="radio" name="metodoPago" value="tarjeta" checked>
                        <span class="texto-opcion">Tarjeta de Crédito / Débito</span>
                        <span class="icono-pago">💳</span>
                    </label>
                    
                    <!-- Formulario Tarjeta -->
                    <div id="formTarjeta" class="detalles-pago activo">
                        <div class="grupo-input-modal">
                            <label for="card-element">Datos de la tarjeta</label>
                            <!-- Contenedor donde Stripe montará el formulario seguro -->
                            <div id="card-element"></div>
                            <!-- Mensajes de error de la tarjeta -->
                            <div id="card-errors" role="alert"></div>
                        </div>
                    </div>

                    
                </div>

                <button id="botonConfirmarPago" type="submit" class="boton-pagar" style="margin-top: 20px;">
                    <span id="button-text">CONFIRMAR Y PAGAR</span>
                    <div id="spinner" class="spinner" style="display: none;"></div>
                </button>
            </form>
        </div>
    </div>

    <footer th:replace="~{fragmentos/layout :: footer}"></footer>

</body>

</html>
