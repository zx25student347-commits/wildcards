<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Carrito — Wildcards</title>
    <link rel="stylesheet" href="carrito.css">
</head>

<body>
    <header class="cabecera-sitio">
        <div class="contenedor-nav">
            <a href="../carta comprobacion/Muestra_Carta.html">
                <div class="logo">WILDCARDS</div>
            </a>
            <nav class="nav-principal">
                <ul>
                    <li><a href="#">Pokémon</a></li>
                    <li><a href="#">One Piece</a></li>
                    <li><a href="#">Yugioh</a></li>
                    <li><a href="#">Magic</a></li>
                </ul>
            </nav>

            <form class="formulario-busqueda" action="#" role="search">
                <input type="search" placeholder="Buscar">
                <button type="submit">Buscar</button>
            </form>

            <div class="iconos">
                <a href="#"><img src="../carta comprobacion/icons/person.png" alt="usuario" class="icono"></a>
                <a href="../carrito/carrito.html" id="cartLink"><img src="../carta comprobacion/icons/carrito.png" alt="carrito" class="icono"></a>
                <div id="cartCount" class="cart-count"></div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <h1 class="page-title">Tu carrito</h1>
            <p class="page-sub">Revisa los artículos y cambia cantidades antes de pagar</p>

            <section class="cart-wrapper">
                <div id="cartList" class="cart-list">
                    <!-- Items rendered here -->
                </div>

                <aside class="cart-summary">
                    <div class="summary-box">
                        <h3>Resumen</h3>
                        <p>Artículos: <span id="summaryCount">0</span></p>
                        <p>Total: <strong id="summaryTotal">0.00 €</strong></p>
                        <button id="checkout" class="btn-checkout">PAGAR</button>
                    </div>
                </aside>
            </section>
        </div>
    </main>

    <template id="cartItemTpl">
        <div class="cart-item">
            <img class="item-img" src="" alt="">
            <div class="item-body">
                <div class="item-title"></div>
                <div class="item-meta"></div>
            </div>
            <div class="item-controls">
                <input type="number" class="item-qty" min="1" value="1">
                <div class="item-price"></div>
                <button class="item-remove">Eliminar</button>
            </div>
        </div>
    </template>

    <script>
        // Utilities for cart stored in localStorage
        function getCart() { try { return JSON.parse(localStorage.getItem('cart') || '[]'); } catch (e) { return []; } }
        function setCart(c) { localStorage.setItem('cart', JSON.stringify(c)); }

        // format price: accepts '2.49 €' or number
        function parsePrice(p) {
            if (typeof p === 'number') return p;
            if (!p) return 0;
            return Number(String(p).replace('€', '').trim().replace(',', '.'));
        }

        function formatPrice(n) { return n.toFixed(2) + ' €'; }

        function renderCart() {
            const list = document.getElementById('cartList'); list.innerHTML = '';
            const tpl = document.getElementById('cartItemTpl');
            const cart = getCart();
            let total = 0; let count = 0;
            cart.forEach(item => {
                const node = tpl.content.cloneNode(true);
                node.querySelector('.item-img').src = item.img || '../carta comprobacion/ghost_belle.png';
                node.querySelector('.item-img').alt = item.title || '';
                node.querySelector('.item-title').textContent = item.title || '';
                node.querySelector('.item-meta').textContent = item.id || '';
                const qtyEl = node.querySelector('.item-qty'); qtyEl.value = item.qty || 1;
                const priceVal = parsePrice(item.price);
                node.querySelector('.item-price').textContent = formatPrice(priceVal * (item.qty || 1));

                // qty change
                qtyEl.addEventListener('change', (e) => {
                    const q = Math.max(1, Number(e.target.value || 1));
                    item.qty = q; setCart(cart); renderCart();
                });

                // remove
                node.querySelector('.item-remove').addEventListener('click', () => {
                    const idx = cart.findIndex(c => c.id === item.id);
                    if (idx >= 0) { cart.splice(idx, 1); setCart(cart); renderCart(); }
                });

                list.appendChild(node);
                total += priceVal * (item.qty || 1);
                count += Number(item.qty || 0);
            });

            document.getElementById('summaryTotal').textContent = formatPrice(total);
            document.getElementById('summaryCount').textContent = count;
            // show message if empty
            if (cart.length === 0) { list.innerHTML = '<p class="empty">Tu carrito está vacío.</p>'; }
        }

        document.getElementById('checkout').addEventListener('click', () => {
            alert('Funcion de pago no implementada en demo.');
        });

        // update header cart count (show/hide)
        function updateHeaderCartCount(){
          const cart = getCart();
          const count = cart.reduce((s,i)=>s+Number(i.qty||0),0);
          const el = document.getElementById('cartCount');
          if(!el) return;
          if(count===0) el.style.display='none'; else { el.style.display='inline-block'; el.textContent = count; }
        }
        updateHeaderCartCount();
        // when cart changes (user on this page) renderCart calls setCart which doesn't trigger this; ensure update after render actions
        // override setCart to also update header
        const _setCart = setCart;
        setCart = function(c){ _setCart(c); updateHeaderCartCount(); };
        // initial render
        renderCart();
    </script>
</body>

</html>
