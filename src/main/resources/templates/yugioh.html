<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh Cartas</title>
    <link rel="stylesheet" href="/css/fragmentos-estilo.css">
    <link rel="stylesheet" href="/css/wildcards.css">
    <script src="js/wildcards.js" defer></script>
    <script src="js/productos.js" defer></script>

</head>

<body class="pagina-tienda">
    <header th:replace="~{fragmentos/layout :: header}"></header>

    <main>
        <div class="contenedor-tienda">

            <aside class="barra-lateral">
                <div class="filtro-container">
                    <h3>Filtrar por</h3>

                    <div class="filtro-grupo">
                        <h4>Precio</h4>
                        <div class="rango-valores">
                            <span id="min-price-val">0€</span>
                            <span id="max-price-val">500€</span>
                        </div>
                        <div class="double-slider-container">
                            <div class="slider-track"></div>
                            <input type="range" min="0" max="500" value="0" class="min-price" id="min-price">
                            <input type="range" min="0" max="500" value="500" class="max-price" id="max-price">
                        </div>
                    </div>

                    <div class="filtro-grupo">
                        <h4>Set</h4>
                        <select id="filtro-set" class="filtro-select">
                            <option value="">Todos los Sets</option>
                        </select>
                    </div>

                    <div class="filtro-grupo">
                        <h4>Idioma</h4>
                        <label class="opcion-filtro"><input type="checkbox" name="idioma" value="en"> Inglés</label>
                        <label class="opcion-filtro"><input type="checkbox" name="idioma" value="es"> Español</label>
                        <label class="opcion-filtro"><input type="checkbox" name="idioma" value="jp"> Japonés</label>
                    </div>
                </div>
            </aside>

            <section class="listado-productos">
                <h1>Yu-Gi-Oh! TCG</h1>
                <p>Explora nuestra colección de cartas y productos.</p>

                <div id="productos-grid" class="productos-grid"></div>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragmentos/layout :: footer}"></footer>
</body>

</html>
