<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WildCards</title>
    <link rel="stylesheet" href="css/wildcards.css">
    <link rel="stylesheet" href="css/fragmentos-estilo.css">
    <script src="js/login.js" defer></script>

</head>
<body class="pagina-login">
    <!-- Banda lateral con Carrusel Vertical -->
    <div class="carrusel-vertical">
        <div class="carrusel-vertical-track v-medium">
            <!-- Imágenes originales -->
            <img src="/img/MCX.png" class="carrusel-vertical-item" alt="Card 1">
            <img src="/img/MG.png" class="carrusel-vertical-item" alt="Card 2">
            <img src="/img/ML.png" class="carrusel-vertical-item" alt="Card 3">
            <img src="/img/Victiniex.png" class="carrusel-vertical-item" alt="Card 4">
            <!-- Duplicado idéntico para el efecto de bucle infinito -->
            <img src="/img/MCX.png" class="carrusel-vertical-item" alt="Card 1">
            <img src="/img/MG.png" class="carrusel-vertical-item" alt="Card 2">
            <img src="/img/ML.png" class="carrusel-vertical-item" alt="Card 3">
            <img src="/img/Victiniex.png" class="carrusel-vertical-item" alt="Card 4">
        </div>
    </div>

    <!-- Banda lateral DERECHA con Carrusel Vertical inverso -->
    <div class="carrusel-vertical der">
        <div class="carrusel-vertical-track v-slow reverse">
            <!-- Diferentes imágenes para variar -->
            <img src="/img/shanks-manga.png" class="carrusel-vertical-item" alt="Card 5">
            <img src="/img/ace-manga.png" class="carrusel-vertical-item" alt="Card 6">
            <img src="/img/boa-manga.png" class="carrusel-vertical-item" alt="Card 7">
            <img src="/img/Umbreon-ex.png" class="carrusel-vertical-item" alt="Card 8">
            <!-- Duplicado para loop -->
            <img src="/img/shanks-manga.png" class="carrusel-vertical-item" alt="Card 5">
            <img src="/img/ace-manga.png" class="carrusel-vertical-item" alt="Card 6">
            <img src="/img/boa-manga.png" class="carrusel-vertical-item" alt="Card 7">
            <img src="/img/Umbreon-ex.png" class="carrusel-vertical-item" alt="Card 8">
        </div>
    </div>

    <div class="contenedor-login">
        
        <a href="/" class="logo-login">WILDCARDS</a>

        <form class="formulario-login"  id="loginForm">
            <h2>Iniciar Sesión</h2>
            
            <div class="grupo-input">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="acciones-login">
                <button type="submit" class="btn-continuar">Continuar</button>
                <a href="/registro" class="btn-registrar">Registrarte</a>
            </div>
            <div class="sprite-login-container">
                <img src="/icons/pikachu.gif" alt="Pikachu sprite animado" />
            </div>
        </form>
    </div>
</body>
</html>
