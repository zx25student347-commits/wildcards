<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WildCards</title>
    <link rel="stylesheet" href="css/wildcards.css">
    <script src="js/wildcarsds.js" defer></script>

</head>
<body class="pagina-login">
    <div class="contenedor-login">
        
        <a href="index.html" class="logo-login">WILDCARDS</a>

        <form class="formulario-login"  id="loginForm">
            <h2>Iniciar Sesión</h2>
            
            <div class="grupo-input">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="acciones-login">
                <button type="submit" class="btn-continuar">Continuar</button>
                <a href="registro.html" class="btn-registrar">Registrarte</a>
            </div>
        </form>
    </div>
</body>
</html>
