<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Detalle de Carta — Muestra</title>
    <link rel="stylesheet" href="detalles-carta.css">
    <style>
        /* small reset for fonts if Google Fonts not available */
        html,
        body {
            height: 100%;
        }
    </style>
</head>

<body>

    <header class="cabecera-sitio">
        <div class="contenedor-nav">
            <a href="index.html">
                <div class="logo">WILDCARDS</div>
            </a>

            <nav class="nav-principal">
                <ul>
                    <li><a href="#">Pokémon</a></li>
                    <li><a href="#">One Piece</a></li>
                    <li><a href="#">Yugioh</a></li>
                    <li><a href="#">Magic</a></li>
                    <li><a href="#">Accesorios</a></li>
                </ul>
            </nav>

            <form class="formulario-busqueda" action="#" role="search">
                <input type="search" placeholder="Buscar" aria-label="Buscar">
                <button type="submit">Buscar</button>
            </form>

            <div class="iconos">
                <a href="#"><img src="icons/person.png" alt="usuario" class="icono"></a>
                <a href="#" id="cartLink"><img src="icons/carrito.png" alt="carrito" class="icono"></a>
                <div id="cartCount" class="cart-count"></div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <section class="single-card">
                <div class="single-img">
                    <img id="singleImg" src="ghost_belle.png" alt="Imagen carta">
                </div>
                <div class="single-info">
                    <h2 id="singleTitle">Ground Death (OP14-096) (V.1)</h2>
                    <p class="meta"><strong>Juego:</strong> <span id="singleGame">One Piece</span></p>
                    <p class="meta"><strong>Set:</strong> <span id="singleSet">The Azure Sea's Seven</span></p>
                    <p class="meta"><strong>Número:</strong> <span id="singleNumber">096</span></p>
                    <p class="meta"><strong>Rareza:</strong> <span id="singleRarity">R</span></p>
                    <p class="meta"><strong>Precio:</strong> <span id="singlePrice">2.49 €</span></p>
                    <p id="singleDesc" class="desc">Carta de evento. If you may rest 2 of your DON!! cards...</p>

                    <div class="purchase-row">
                        <div class="price"><span id="priceValue">2.49 €</span></div>
                        <div class="qty-wrap">
                            <label for="qty">Cantidad</label>
                            <input id="qty" type="number" min="1" value="1">
                        </div>
                        <button id="addCart" class="btn-add">AÑADIR AL CARRITO</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // Datos de ejemplo
        const card = {
            id: 'OP14-096',
            title: 'Ground Death (OP14-096) (V.1)',
            game: 'One Piece',
            set: "The Azure Sea's Seven",
            number: '096',
            rarity: 'R',
            price: '2.49 €',
            desc: 'Carta de evento. If you may rest 2 of your DON!! cards...',
            img: 'ghost_belle.png'
        };

        function renderSingle(c){
            document.getElementById('singleImg').src = c.img;
            document.getElementById('singleTitle').textContent = c.title;
            document.getElementById('singleGame').textContent = c.game;
            document.getElementById('singleSet').textContent = c.set;
            document.getElementById('singleNumber').textContent = c.number;
            document.getElementById('singleRarity').textContent = c.rarity;
            document.getElementById('singlePrice').textContent = c.price;
            document.getElementById('singleDesc').textContent = c.desc;
            document.getElementById('priceValue').textContent = c.price;
        }

        renderSingle(card);

        // Carrito simple (localStorage)
        function getCart(){ try{ return JSON.parse(localStorage.getItem('cart')||'[]'); }catch(e){ return []; } }
        function setCart(c){ localStorage.setItem('cart', JSON.stringify(c)); updateCartCount(); }
        function updateCartCount(){
            const count = getCart().reduce((s,i)=>s+Number(i.qty||0),0);
            const el = document.getElementById('cartCount');
            if(!el) return;
            if(count === 0){ el.style.display = 'none'; }
            else { el.style.display = 'inline-block'; el.textContent = count; }
        }

        document.getElementById('addCart').addEventListener('click', ()=>{
            const qty = Math.max(1, Number(document.getElementById('qty').value||1));
            const cart = getCart();
            const existing = cart.find(i=>i.id===card.id);
            if(existing) existing.qty = Number(existing.qty)+qty;
            else cart.push({ id: card.id, title: card.title, price: card.price, qty });
            setCart(cart);
            const btn = document.getElementById('addCart'); btn.textContent='AÑADIDO ✓'; btn.disabled=true;
            setTimeout(()=>{ btn.textContent='AÑADIR AL CARRITO'; btn.disabled=false; },1200);
        });

        // Init
        updateCartCount();
    </script>

</body>

</html>
