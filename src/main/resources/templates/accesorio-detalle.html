<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Accesorio</title>
    <link rel="stylesheet" href="/css/detalles-carta.css">
    <script src="/js/accesorio-detalle.js" defer></script>
</head>
<body>
    
    <header class="cabecera-sitio">
        <div class="contenedor-nav">
            <a href="/">
                <div class="logo">WILDCARDS</div>
            </a>

            <nav class="nav-principal">
                <ul>
                    <li><a href="/pokemon">Pokémon</a></li>
                    <li><a href="/onepiece">One Piece</a></li>
                    <li><a href="/yugioh">Yugioh</a></li>
                    <li><a href="/magic">Magic</a></li>
                    <li><a href="/accesorios">Accesorios</a></li>
                </ul>
            </nav>

            <form class="formulario-busqueda" action="#" role="search">
                <input type="search" placeholder="Buscar" aria-label="Buscar">
                <button type="submit">Buscar</button>
            </form>

            <div class="iconos">
                <a href="/login"><img src="/icons/person.png" alt="usuario" class="icono"></a>
                <a href="/carrito"><img src="icons/carrito.png" alt="carrito" class="icono"></a>
            </div>
        </div>
    </header>

    <div class="page">
        <div class="container">
            <div class="breadcrumbs">
                <a href="/" style="color: inherit; text-decoration: none;">Inicio</a> &gt; 
                <a href="/accesorios" style="color: inherit; text-decoration: none;">Accesorios</a> &gt; 
                <span id="accesorio-breadcrumb-nombre">Cargando...</span>
            </div>
            
            <div class="detail-grid">
                <div class="detail-left">
                    <img id="accesorio-imagen" class="card-large" src="https://placehold.co/400x560?text=Cargando..." alt="Imagen del accesorio">
                </div>
                
                <div class="detail-center">
                    <h1 class="page-title" id="accesorio-nombre">Nombre del Accesorio</h1>
                    
                    <div class="info-box">
                        <div class="desc" id="accesorio-descripcion">Descripción del accesorio...</div>
                        
                        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <p style="color: var(--accent); font-weight: bold;">Disponibilidad:</p>
                            <span id="accesorio-stock">Consultando stock...</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-right">
                    <div style="background: var(--panel); padding: 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04);">
                        <h3 style="margin-top:0; color: var(--white);">Comprar</h3>
                        <div class="purchase-row">
                            <span id="accesorio-precio" class="price" style="font-size: 1.5rem;">0.00 €</span>
                        </div>
                        <div style="margin-top: 15px;">
                            <button class="btn-add" style="width: 100%;">Añadir al carrito</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="pie_pagina">
        <div class="enlaces_footers">
            <ul>
                <li><a href="#">Centro de Ayuda</a></li>
                <li><a href="#">Políticas de Devolución</a></li>
                <li><a href="#">Contacto Directo</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
