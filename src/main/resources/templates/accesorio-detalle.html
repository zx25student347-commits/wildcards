<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Accesorio</title>
    <link rel="stylesheet" href="/css/fragmentos-estilo.css">
    <link rel="stylesheet" href="/css/wildcards.css">
    <link rel="stylesheet" href="/css/detalles-carta.css">
    <script src="/js/wildcards.js" defer></script>
    <script src="/js/accesorio-detalle.js" defer></script>
</head>
<body>
    
    <header th:replace="~{fragmentos/layout :: header}"></header>

    <div class="page">
        <div class="container">
            <div class="breadcrumbs">
                <a href="/">Inicio</a> &gt; 
                <a href="/accesorios">Accesorios</a> &gt; 
                <span id="accesorio-breadcrumb-nombre">Cargando...</span>
            </div>
            
            <div class="detail-grid">
                <div class="detail-left">
                    <img id="accesorio-imagen" class="card-large" src="https://placehold.co/400x560?text=Cargando..." alt="Imagen del accesorio">
                </div>
                
                <div class="detail-center">
                    <h1 class="page-title" id="accesorio-nombre">Nombre del Accesorio</h1>
                    
                    <div class="info-box">
                        <div class="desc" id="accesorio-descripcion">Descripción del accesorio...</div>
                    </div>
                </div>
                
                <div class="detail-right">
                    <div style="background: var(--panel); padding: 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04);">
                        <h3 style="margin-top:0; color: var(--white);">Comprar</h3>
                        <div class="purchase-row">
                            <span id="accesorio-precio" class="price" style="font-size: 1.5rem;">0.00 €</span>
                        </div>
                        <div class="quantity-control" style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                            <label for="cantidad" style="color: var(--muted); font-size: 0.9rem;">Cantidad:</label>
                            <div class="qty-selector">
                                <button type="button" class="qty-btn minus">-</button>
                                <input type="number" id="cantidad" value="1" min="1" readonly>
                                <button type="button" class="qty-btn plus">+</button>
                            </div>
                            <span class="stock-available">(Stock: <span id="accesorio-stock-num">0</span>)</span>
                        </div>
                        <div style="margin-top: 15px;">
                            <button id="btnAgregarCarrito" class="btn-add" style="width: 100%;">Añadir al carrito</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragmentos/layout :: footer}"></footer>

</body>
</html>
