<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildCards</title>
    <link rel="stylesheet" href="css/wildcards.css">
    <script src="js/wildcarsds.js" defer></script>
</head>

<body>
    <header class="cabecera-sitio">
        <div class="contenedor-nav">
            <a href="/">
                <div class="logo">WILDCARDS</div>
            </a>

            <nav class="nav-principal">
                <ul>
                    <li><a href="/pokemon">Pokémon</a></li>
                    <li><a href="/onepiece">One Piece</a></li>
                    <li><a href="/yugioh">Yugioh</a></li>
                    <li><a href="/magic">Magic</a></li>
                    <li><a href="/accesorios">Accesorios</a></li>
                </ul>
            </nav>

            <form class="formulario-busqueda" action="#" role="search">
                <input type="search" placeholder="Buscar" aria-label="Buscar">
                <button type="submit">Buscar</button>
            </form>

            <div class="iconos">
                <a href="/login"><img src="icons/person.png" alt="usuario" class="icono"></a>
                <a href="/carrito"><img src="icons/carrito.png" alt="carrito" class="icono"></a>
            </div>
        </div>
    </header>

    <main>
        <div class="carrusel">
            <div class="carrusel-imagenes">
                <img src="img/PKbanner.png" alt="Banner Pokémon" class="carrusel-imagen">
                <img src="img/onepiece_banner.jpg" alt="Banner One Piece" class="carrusel-imagen">
                <img src="img/yugioh_banner.jpg" alt="Banner Yu Gi Oh!" class="carrusel-imagen">
                <img src="img/magic_banner.jpg" alt="Banner magic" class="carrusel-imagen">
            </div>
            <button class="carrusel-boton prev" aria-label="Anterior">&#10094;</button>
            <button class="carrusel-boton next" aria-label="Siguiente">&#10095;</button>
        </div>

        <section class="categorias-destacadas">
            <a href="/pokemon">
                <div class="categoria-item">
                    <div class="categoria-cuadrado">
                        <img src="img/PKcards.png" alt="Pokémon">
                    </div>
                    <span class="categoria-nombre">Pokémon</span>
                </div>
            </a>
            <a href="/onepiece">
                <div class="categoria-item">
                    <div class="categoria-cuadrado">
                        <img src="img/onepiece.png" alt="One Piece">
                    </div>
                    <span class="categoria-nombre">One Piece</span>
                </div>
            </a>
            <a href="/yugioh">
                <div class="categoria-item">
                    <div class="categoria-cuadrado">
                        <img src="img/yugioh_icon.jpg" alt="Yugioh">
                    </div>
                    <span class="categoria-nombre">Yugioh</span>
                </div>
            </a>
            <a href="/magic">
                <div class="categoria-item">
                    <div class="categoria-cuadrado">
                        <img src="img/magicportada.png" alt="Magic">
                    </div>
                    <span class="categoria-nombre">Magic</span>
                </div>
            </a>
            <a href="/accesorios">
                <div class="categoria-item">
                    <div class="categoria-cuadrado">
                        <img src="img/accessory_icon.jpg" alt="accesorios">
                    </div>
                    <span class="categoria-nombre">Accesorios</span>
                </div>
            </a>
        </section>
    </main>
    <footer id="pie_pagina">
        <div class="footer-contenedor">
            <div class="footer-columna">
                <!-- Logo que redirige al principio (#) -->
                <a href="#" class="footer-logo">WILDCARDS</a>
            </div>
            <div class="footer-columna">
                <h4>Categorías</h4>
                <ul>
                    <li><a href="/pokemon">Pokémon</a></li>
                    <li><a href="/onepiece">One Piece</a></li>
                    <li><a href="/yugioh">Yugioh</a></li>
                    <li><a href="/magic">Magic</a></li>
                    <li><a href="/accesorios">Accesorios</a></li>
                </ul>
            </div>
            <div class="footer-columna">
                <h4>Ayuda</h4>
                <ul>
                    <li><a href="#">Centro de Ayuda</a></li>
                    <li><a href="#">Políticas de Devolución</a></li>
                    <li><a href="#">Contacto Directo</a></li>
                </ul>
            </div>
        </div>
    </footer>

</body>

</html>
