<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - WildCards</title>
    <link rel="stylesheet" href="css/wildcards.css">
    <link rel="stylesheet" href="css/fragmentos-estilo.css">
    <script src="js/log-Reg.js" defer></script>
</head>
<body class="pagina-login">

    <!-- Banda lateral con Carrusel Vertical -->
    <div class="carrusel-vertical">
        <div class="carrusel-vertical-track v-medium">
            <!-- Imágenes originales -->
            <img src="/img/MCX.png" class="carrusel-vertical-item" alt="Card 1">
            <img src="/img/BlackLotus.png" class="carrusel-vertical-item" alt="Black Lotus">
            <img src="/img/Dragon_vortice.jpg" class="carrusel-vertical-item" alt="Odd-Eyes Vortex Dragon">
            <img src="/img/shanks-manga.png" class="carrusel-vertical-item" alt="Shanks">
            <!-- Duplicado idéntico para el efecto de bucle infinito -->
            <img src="/img/MCX.png" class="carrusel-vertical-item" alt="Card 1">
            <img src="/img/BlackLotus.png" class="carrusel-vertical-item" alt="Black Lotus">
            <img src="/img/Dragon_vortice.jpg" class="carrusel-vertical-item" alt="Odd-Eyes Vortex Dragon">
            <img src="/img/shanks-manga.png" class="carrusel-vertical-item" alt="Shanks">
        </div>
    </div>

    <!-- Banda lateral DERECHA con Carrusel Vertical inverso -->
    <div class="carrusel-vertical der">
        <div class="carrusel-vertical-track v-slow reverse">
            <!-- Diferentes imágenes para variar -->
            <img src="/img/ragavan.jpg" class="carrusel-vertical-item" alt="Ragavan, ratero hábil">
            <img src="/img/ghostMourner.jpg" class="carrusel-vertical-item" alt="Ghost Mourner & Moonlit Chill">
            <img src="/img/susurradora.png" class="carrusel-vertical-item" alt="Sheoldred, la Susurradora">
            <img src="/img/boa-manga.png" class="carrusel-vertical-item" alt="Boa Hancock">
            <!-- Duplicado para loop -->
            <img src="/img/ragavan.jpg" class="carrusel-vertical-item" alt="Ragavan, ratero hábil">
            <img src="/img/ghostMourner.jpg" class="carrusel-vertical-item" alt="Ghost Mourner & Moonlit Chill">
            <img src="/img/susurradora.png" class="carrusel-vertical-item" alt="Sheoldred, la Susurradora">
            <img src="/img/boa-manga.png" class="carrusel-vertical-item" alt="Boa Hancock">
        </div>
    </div>


    <div class="contenedor-login">
        
        <a href="/" class="logo-login">WILDCARDS</a>

        <form class="formulario-login" id="registerForm">

            <h2>Crear Cuenta</h2>
            
            <div class="grupo-input">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                <span class="error-mensaje" id="error-nombre"></span>
            </div>

            <div class="grupo-input">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required>
                <span class="error-mensaje" id="error-apellidos"></span>
            </div>

            <div class="grupo-input">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <span class="error-mensaje" id="error-email"></span>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="******" required>
                <span class="error-mensaje" id="error-password"></span>
            </div>

            <div class="error-mensaje general" id="error-general"></div>

            <div class="acciones-login">
                <button type="submit" class="btn-continuar">Crear Cuenta</button>
                <a href="/" class="btn-registrar">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
