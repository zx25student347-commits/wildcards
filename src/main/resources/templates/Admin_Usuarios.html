<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Usuarios</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="/js/dashboard_usuarios.js" defer></script>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h2>WildCards Admin</h2>
            <nav>
                <ul>
                    <li><a href="/admin/dashboard" style="color: inherit; text-decoration: none; display: block;">Gestión de cartas</a></li>
                    <li><a href="/admin/accesorios" style="color: inherit; text-decoration: none; display: block;">Gestión de Accesorios</a></li>
                    <li class="active"><a href="/admin/usuarios" style="color: inherit; text-decoration: none; display: block;">Gestión de Usuarios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Gestión de Usuarios</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-add" id="btnNuevoUsuario"> Nuevo Usuario</button>
                </div>
            </header>

            <section class="filters">
                <input type="text" placeholder="Buscar por username..." id="buscarUsername">
            </section>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Roles</th>
                            <th>Habilitado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuariosBody">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal de confirmación de eliminación -->
    <div id="modalConfirmacion" class="modal">
        <div class="modal-content modal-confirmacion">
            <div class="modal-header-confirmacion">
                <h2>Confirmar Eliminación</h2>
            </div>
            <div class="modal-body-confirmacion">
                <p>¿Quieres eliminar el usuario <strong id="nombreUsuarioEliminar"></strong>?</p>
            </div>
            <div class="modal-footer-confirmacion">
                <button class="btn-no" id="btnNo">No</button>
                <button class="btn-si" id="btnSi">Sí</button>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar usuario -->
    <div id="modalNuevoUsuario" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tituloModal">Crear Nuevo Usuario</h2>
                <button class="btn-cerrar" id="btnCerrarModal">&times;</button>
            </div>
            <form class="formulario-carta" id="formularioUsuario">
                <div class="form-group">
                    <label for="username">Username (Email):</label>
                    <input type="email" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Dejar en blanco para no cambiar">
                </div>

                <div class="form-group">
                    <label for="roles">Rol Principal:</label>
                    <select id="roles" name="roles">
                        <option value="USER">Usuario</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>

                <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
                    <label for="enabled" style="margin:0;">Habilitado:</label>
                    <input type="checkbox" id="enabled" name="enabled" checked style="width: auto;">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submitform" id="btnSubmit">Crear Usuario</button>
                    <button type="button" class="btn-cancelform" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
